[package]
name = "tokensave-lite-treesitters"
version = "0.2.1"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
edition = "2024"
description = "Essential tree-sitter grammars for tokensave (7 languages), pure Rust: no C grammar sources"
license = "MIT"
repository = "https://github.com/aovestdipaperino/tokensave-lite-treesitters"
readme = "README.md"

[workspace]

[dependencies]
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-lite-rs = { version = "0.1.0", git = "https://github.com/aovestdipaperino/tree-sitter-lite-rs", branch = "main" }
